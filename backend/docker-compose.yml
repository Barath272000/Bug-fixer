services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bugfixai
      POSTGRES_PASSWORD: bugfixai
      POSTGRES_DB: bugfixai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    volumes:
      - ./storage:/app/storage
      - ./sandbox-work:/app/sandbox-work
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./storage:/app/storage
      - ./sandbox-work:/app/sandbox-work
volumes:
  postgres_data:
